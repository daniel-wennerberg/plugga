<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugga admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%222%22 y=%228%22 width=%2218%22 height=%2218%22 rx=%225%22 fill=%22%232350c8%22/%3E%3Ccircle cx=%2224%22 cy=%2217%22 r=%225%22 fill=%22%23e8930c%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<style>
body{font-size:16px}
.page{padding:20px 20px 64px;max-width:1440px;margin:0 auto}
.brand small{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-left:2px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);align-items:center}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
/* frågor: lista + redigerare */
.split{display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:20px;align-items:start}
.split.noedit{grid-template-columns:minmax(0,1fr)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters input[type=search]{max-width:260px}
.filters select{padding:7px 10px;font-size:.9rem;max-width:230px}
#amne-sel{max-width:300px}
.bulk{position:sticky;top:62px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.bulk .btn{border-color:var(--paper);color:var(--paper)}
.bulk .btn:hover{background:rgba(255,255,255,.12)}
.bulk select{background:var(--ink);color:var(--paper);border-color:rgba(255,255,255,.4);padding:5px 8px;font-size:.88rem}
.bulk .lvb{border:1.5px solid rgba(255,255,255,.4);background:none;color:var(--paper);border-radius:7px;padding:3px 9px;font-family:var(--mono);font-weight:700}
.bulk .lvb:hover{background:rgba(255,255,255,.15)}
.list{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:grid;grid-template-columns:28px 30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover{background:var(--hover)}
.li.cur{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.li.off{opacity:.55}
.li input{margin:4px 0 0;width:16px;height:16px}
.li .t{font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.li .m{font-size:.8rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .ic{display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.pill{border-radius:99px;padding:1px 8px;font-size:.72rem;font-family:var(--mono);font-weight:700;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.listhead{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1.5px solid var(--line);font-size:.82rem;color:var(--muted);background:var(--paper)}
.more{padding:12px;text-align:center}
/* redigerare */
.editor{position:sticky;top:76px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;max-height:calc(100vh - 96px);overflow:auto}
.editor .eh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.editor textarea#e-fraga{min-height:64px;font-weight:700}
.hint{font-size:.8rem;color:var(--muted)}
.cilist{border:1.5px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;padding:4px 10px}
.cilist h5{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;font-weight:500}
.cilist label{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:.88rem;padding:4px 0;line-height:1.35;cursor:pointer}
.cilist label input{margin-top:3px}
.cilist label.on{color:var(--accent);font-weight:700}
.preview{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pv{border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:.9rem;display:grid;gap:6px;align-content:start;min-height:90px}
.pv.back{border-color:var(--accent)}
.pv .lv{justify-self:start}
.pv .q{font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.25}
.crit{font-size:.84rem;background:var(--paper);border-radius:10px;padding:10px 12px;display:grid;gap:6px;max-height:180px;overflow:auto}
details>summary{cursor:pointer;font-size:.85rem;color:var(--accent);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addinline{display:flex;gap:6px;margin-top:6px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:10px;padding:8px 10px;font-size:.9rem}
.dirty{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:10px;padding:8px 10px;font-size:.9rem}
.estatus{font-size:.8rem;color:var(--muted)}
@media (max-width:1100px){
  .split{grid-template-columns:minmax(0,1fr)}
  .editor{position:fixed;inset:0;top:0;border-radius:0;max-height:none;z-index:50;padding:16px max(16px,calc((100vw - 640px)/2))}
}
@media (max-width:560px){.preview,.two{grid-template-columns:1fr}.page{padding:16px 12px 64px}}
/* täckning */
.cov{display:grid;gap:22px;max-width:1100px}
.covrow{display:grid;grid-template-columns:minmax(0,1fr) 190px auto;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.covrow.gap{background:var(--flame-soft)}
.covrow .cnt{display:flex;gap:4px;font-family:var(--mono);font-size:.8rem;align-items:center}
.covbox{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.covbox h4{padding:10px 12px;background:var(--paper);border-bottom:1.5px solid var(--line);font-size:.92rem}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grades>div{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:.88rem;display:grid;gap:8px;align-content:start}
@media (max-width:900px){.grades{grid-template-columns:1fr}.covrow{grid-template-columns:1fr}}
/* grupper */
.groups{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:900px){.groups{grid-template-columns:1fr}}
.gbox{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.gi{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.gi .ord{display:flex;flex-direction:column}
.gi .ord button{border:0;background:none;padding:0 4px;line-height:1;color:var(--muted);font-size:.8rem}
.gi .ord button:hover{color:var(--ink)}
.gi .n{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:28px;text-align:right}
.io{display:grid;gap:20px;max-width:760px}
.io .box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
pre.fmt{font-family:var(--mono);font-size:.78rem;background:var(--paper);border-radius:10px;padding:12px;overflow:auto;margin:0}
</style>
</head>
<body>
<header class="top">
  <div class="top-in wide">
    <a class="brand" href="#fragor"><span class="dot"></span>Plugga<small>admin</small></a>
    <label class="sel"><span>Ämne</span><select id="amne-sel"></select></label>
    <nav class="tabs" aria-label="Adminmeny">
      <a href="#fragor">Frågor</a>
      <a href="#tackning">Läroplan &amp; täckning</a>
      <a href="#grupper">Teman &amp; samlingar</a>
      <a href="#io">Import/export</a>
      <a href="/" target="_blank" rel="noopener">Flashcards ↗</a>
    </nav>
  </div>
</header>
<div class="page">

<section id="v-fragor" hidden>
  <div class="head">
    <div><p class="eyebrow" id="f-eyebrow"></p><h2 id="f-title">Frågor</h2></div>
    <div class="row"><div class="stats" id="f-stats"></div><button class="btn primary" id="new-q">+ Ny fråga</button></div>
  </div>
  <div class="split" id="split">
    <div>
      <div class="filters">
        <input type="search" id="q" placeholder="Sök i frågor, svar, källa…" aria-label="Sök">
        <div class="chips" id="fl-niva"></div>
        <select id="fl-tema" aria-label="Tema"></select>
        <select id="fl-samling" aria-label="Samling"></select>
        <select id="fl-granskad" aria-label="Granskning"><option value="">Granskade och ej</option><option value="0">Ej granskade</option><option value="1">Granskade</option></select>
        <select id="fl-ci" aria-label="Läroplanskoppling"></select>
        <select id="fl-aktiv" aria-label="Synlighet"><option value="">Synliga och dolda</option><option value="1">Synliga i flashcards</option><option value="0">Dolda</option></select>
        <button class="btn ghost sm" id="fl-reset" hidden>Rensa filter</button>
      </div>
      <div class="bulk" id="bulk" hidden></div>
      <div class="list" id="list"></div>
    </div>
    <aside class="editor" id="editor" hidden aria-label="Redigera fråga"></aside>
  </div>
</section>

<section id="v-tackning" hidden><div class="cov" id="cov"></div></section>
<section id="v-grupper" hidden><div class="groups" id="groups"></div></section>
<section id="v-io" hidden><div class="io" id="io"></div></section>

</div>
<script src="common.js"></script>
<script>
const KEY = 'plugga-admin-v1';
const ST = Object.assign({ amne: 'GRGRKEM01', f: {} }, load(KEY, {}));
const F = Object.assign({ q: '', niva: [], tema: '', samling: '', granskad: '', ci: '', aktiv: '' }, ST.f);
const saveSt = () => { ST.f = F; store(KEY, ST); };
let AMNEN = [], A = null, Q = [], SEL = new Set(), EDIT = null, DRAFT = null, dirty = false, LIMIT = 200, bulkConfirm = false;

/* ---------------- laddning ---------------- */
async function boot() {
  try { AMNEN = await api('amnen'); } catch (e) { $('.page').innerHTML = `<div class="empty">Kan inte nå servern: ${esc(e.message)}</div>`; return; }
  if (!AMNEN.some(a => a.kod === ST.amne)) ST.amne = AMNEN[0].kod;
  renderAmneSel();
  await loadAmne(ST.amne);
  route();
}
function renderAmneSel() {
  $('#amne-sel').innerHTML = AMNEN.map(a => `<option value="${a.kod}"${a.kod === ST.amne ? ' selected' : ''}>${esc(a.namn)}${a.antal ? ` (${a.antal})` : ''}</option>`).join('');
}
$('#amne-sel').addEventListener('change', async e => {
  if (!(await leaveEditor())) { e.target.value = ST.amne; return; }
  ST.amne = e.target.value; Object.assign(F, { tema: '', samling: '', ci: '' }); SEL.clear(); saveSt();
  await loadAmne(ST.amne); route();
});
async function loadAmne(kod) {
  [A, Q] = await Promise.all([api('amne/' + kod), api('fragor?amne=' + kod)]);
}
async function refresh(keepEdit = true) {
  const [amnen] = await Promise.all([api('amnen'), loadAmne(ST.amne)]);
  AMNEN = amnen; renderAmneSel();
  SEL = new Set([...SEL].filter(id => Q.some(q => q.id === id)));
  if (keepEdit && EDIT && EDIT !== 'ny' && !Q.some(q => q.id === EDIT)) closeEditor(true);
  renderCurrent();
}

/* ---------------- frågelistan ---------------- */
const temaNamn = id => A.teman.find(t => t.id === id)?.namn || '';
const samNamn = id => A.samlingar.find(s => s.id === id)?.namn || '';
function filtered() {
  const q = F.q.trim().toLowerCase();
  return Q.filter(f =>
    (!F.niva.length || F.niva.includes(f.niva)) &&
    (!F.tema || (F.tema === 'ingen' ? !f.tema_id : f.tema_id == F.tema)) &&
    (!F.samling || (F.samling === 'ingen' ? !f.samling_id : f.samling_id == F.samling)) &&
    (F.granskad === '' || f.granskad == F.granskad) &&
    (F.aktiv === '' || f.aktiv == F.aktiv) &&
    (!F.ci || (F.ci === 'ingen' ? !f.ci.length : F.ci === 'andrad' ? f.ci.some(c => c.status !== 'ok') : f.ci.some(c => c.nyckel === F.ci))) &&
    (!q || (f.fraga + ' ' + f.svar + ' ' + f.kalla).toLowerCase().includes(q)));
}
function renderFragor() {
  $('#f-eyebrow').textContent = 'Lgr22 · åk 7–9';
  $('#f-title').textContent = A.namn;
  const n = { E: 0, C: 0, A: 0 }; Q.forEach(f => n[f.niva]++);
  const og = Q.filter(f => !f.granskad).length, utan = Q.filter(f => !f.ci.length).length;
  $('#f-stats').innerHTML = `<span><b>${Q.length}</b> frågor</span><span>${['E', 'C', 'A'].map(x => `${lv(x)} <b>${n[x]}</b>`).join(' &nbsp;')}</span>${og ? `<span><b>${og}</b> ej granskade</span>` : ''}${utan ? `<span><b>${utan}</b> utan läroplanskoppling</span>` : ''}`;
  // filter
  $('#q').value = F.q;
  $('#fl-niva').innerHTML = ['E', 'C', 'A'].map(x => `<button class="chip lvchip lv${x}" data-n="${x}" aria-pressed="${F.niva.includes(x)}">${x}<span class="n">${n[x]}</span></button>`).join('');
  $('#fl-tema').innerHTML = `<option value="">Alla teman</option>${A.teman.map(t => `<option value="${t.id}">${esc(t.namn)} (${t.antal})</option>`).join('')}<option value="ingen">Utan tema</option>`;
  $('#fl-samling').innerHTML = `<option value="">Alla samlingar</option>${A.samlingar.map(s => `<option value="${s.id}">${esc(s.namn)} (${s.antal})</option>`).join('')}<option value="ingen">Utan samling</option>`;
  $('#fl-ci').innerHTML = `<option value="">Alla läroplanspunkter</option><option value="ingen">Utan koppling</option><option value="andrad">Kopplad text har ändrats</option>${A.ci.map(c => `<option value="${esc(c.nyckel)}">${esc((c.variant_namn ? c.variant_namn + ': ' : '') + c.text.slice(0, 70))}${c.text.length > 70 ? '…' : ''} (${c.antal})</option>`).join('')}`;
  $('#fl-tema').value = F.tema; $('#fl-samling').value = F.samling; $('#fl-granskad').value = F.granskad; $('#fl-ci').value = F.ci; $('#fl-aktiv').value = F.aktiv;
  if ($('#fl-tema').value !== String(F.tema)) F.tema = $('#fl-tema').value;
  if ($('#fl-samling').value !== String(F.samling)) F.samling = $('#fl-samling').value;
  if ($('#fl-ci').value !== String(F.ci)) F.ci = $('#fl-ci').value;
  $('#fl-reset').hidden = !(F.q || F.niva.length || F.tema || F.samling || F.granskad !== '' || F.ci || F.aktiv !== '');
  renderList();
}
function renderList() {
  const L = filtered(), shown = L.slice(0, LIMIT);
  const allSel = L.length && L.every(f => SEL.has(f.id));
  $('#list').innerHTML = !Q.length ? `<div class="empty" style="border:0">Inga frågor i ${esc(A.namn)} än. Klicka <b>+ Ny fråga</b> eller importera en fil.</div>`
    : `<div class="listhead"><input type="checkbox" id="selall" ${allSel ? 'checked' : ''} aria-label="Markera alla som visas"><span>${L.length === Q.length ? `${L.length} frågor` : `${L.length} av ${Q.length} frågor`}</span><span></span></div>` +
    (L.length ? shown.map(f => {
      const bad = f.ci.some(c => c.status !== 'ok');
      return `<div class="li${EDIT === f.id ? ' cur' : ''}${f.aktiv ? '' : ' off'}" data-id="${f.id}">
        <input type="checkbox" data-sel="${f.id}" ${SEL.has(f.id) ? 'checked' : ''} aria-label="Markera">
        ${lv(f.niva)}
        <div><div class="t">${esc(plain(f.fraga))}</div><div class="m">${[temaNamn(f.tema_id), samNamn(f.samling_id), f.kalla].filter(Boolean).map(esc).join(' · ') || '<i>Inget tema</i>'}</div></div>
        <div class="ic">${f.aktiv ? '' : '<span class="pill">dold</span>'}${f.ci.length ? `<span class="pill${bad ? ' bad' : ''}" title="${esc(f.ci.map(c => c.text).join('\n'))}">LP ${f.ci.length}</span>` : '<span class="pill warn" title="Inte kopplad till läroplanen">LP –</span>'}${f.granskad ? '<span class="pill ok" title="Granskad">✓</span>' : '<span class="pill" title="Ej granskad">?</span>'}</div>
      </div>`;
    }).join('') + (L.length > LIMIT ? `<div class="more"><button class="btn sm" id="more">Visa ${Math.min(200, L.length - LIMIT)} till</button></div>` : '')
      : `<div class="empty" style="border:0">Inga frågor matchar filtret.</div>`);
  renderBulk();
}
$('#list').addEventListener('click', async e => {
  if (e.target.id === 'more') { LIMIT += 200; renderList(); return; }
  if (e.target.id === 'selall') { const L = filtered(); if (e.target.checked) L.forEach(f => SEL.add(f.id)); else L.forEach(f => SEL.delete(f.id)); renderList(); return; }
  const cb = e.target.closest('[data-sel]');
  if (cb) { const id = +cb.dataset.sel; cb.checked ? SEL.add(id) : SEL.delete(id); renderBulk(); const h = $('#selall'); if (h) h.checked = filtered().every(f => SEL.has(f.id)); return; }
  const row = e.target.closest('.li');
  if (row) openEditor(+row.dataset.id);
});
$('#q').addEventListener('input', e => { F.q = e.target.value; saveSt(); LIMIT = 200; renderList(); $('#fl-reset').hidden = false; });
$('#fl-niva').addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (!b) return; const n = b.dataset.n; F.niva = F.niva.includes(n) ? F.niva.filter(x => x !== n) : [...F.niva, n]; saveSt(); renderFragor(); });
[['#fl-tema', 'tema'], ['#fl-samling', 'samling'], ['#fl-granskad', 'granskad'], ['#fl-ci', 'ci'], ['#fl-aktiv', 'aktiv']].forEach(([s, k]) => $(s).addEventListener('change', e => { F[k] = e.target.value; saveSt(); renderFragor(); }));
$('#fl-reset').onclick = () => { Object.assign(F, { q: '', niva: [], tema: '', samling: '', granskad: '', ci: '', aktiv: '' }); saveSt(); renderFragor(); };

/* ---------------- massändring ---------------- */
function renderBulk() {
  const b = $('#bulk');
  b.hidden = !SEL.size;
  if (!SEL.size) { bulkConfirm = false; return; }
  b.innerHTML = bulkConfirm
    ? `<b>Ta bort ${SEL.size} frågor för alltid?</b><button class="btn sm danger solid" data-b="del-yes">Ja, ta bort</button><button class="btn sm" data-b="del-no">Avbryt</button>`
    : `<b>${SEL.size} markerade</b>
      <span class="small">Nivå</span>${['E', 'C', 'A'].map(n => `<button class="lvb" data-b="niva" data-v="${n}">${n}</button>`).join('')}
      <select data-b="tema"><option value="">Sätt tema…</option>${A.teman.map(t => `<option value="${t.id}">${esc(t.namn)}</option>`).join('')}<option value="0">(inget tema)</option></select>
      <select data-b="samling"><option value="">Sätt samling…</option>${A.samlingar.map(s => `<option value="${s.id}">${esc(s.namn)}</option>`).join('')}<option value="0">(ingen samling)</option></select>
      <select data-b="ci"><option value="">Koppla till läroplanen…</option>${A.ci.map(c => `<option value="${esc(c.nyckel)}">${esc(c.text.slice(0, 60))}…</option>`).join('')}</select>
      <button class="btn sm" data-b="granskad" data-v="1">✓ Granskade</button>
      <button class="btn sm" data-b="granskad" data-v="0">Ej granskade</button>
      <button class="btn sm" data-b="aktiv" data-v="0">Dölj</button>
      <button class="btn sm" data-b="aktiv" data-v="1">Visa</button>
      <button class="btn sm" data-b="del">Ta bort…</button>
      <button class="btn sm ghost" data-b="none" style="margin-left:auto">Avmarkera</button>`;
}
async function doBulk(body, msg) {
  try { await api('fragor/bulk', { method: 'POST', body: { ids: [...SEL], ...body } }); toast(msg); await refresh(); }
  catch (e) { toast(e.message, true); }
}
$('#bulk').addEventListener('click', e => {
  const b = e.target.closest('button[data-b]'); if (!b) return;
  const k = b.dataset.b, v = b.dataset.v;
  if (k === 'none') { SEL.clear(); renderList(); }
  else if (k === 'del') { bulkConfirm = true; renderBulk(); }
  else if (k === 'del-no') { bulkConfirm = false; renderBulk(); }
  else if (k === 'del-yes') { const n = SEL.size; doBulk({ radera: true }, `${n} frågor borttagna`).then(() => { SEL.clear(); bulkConfirm = false; renderList(); }); }
  else if (k === 'niva') doBulk({ satt: { niva: v } }, `Nivå ${v} satt på ${SEL.size} frågor`);
  else if (k === 'granskad') doBulk({ satt: { granskad: v === '1' } }, v === '1' ? 'Markerade som granskade' : 'Markerade som ej granskade');

    const am = AMNEN.find(a => a.kod === IMP.amne_kod), n = (IMP.fragor || []).length;
    if (!am) { $('#imp-info').innerHTML = `<p style="color:var(--bad)">Okänd ämneskod i filen: ${esc(IMP.amne_kod)}</p>`; return; }
    $('#imp-info').innerHTML = `<div style="display:grid;gap:10px"><p><b>${n}</b> frågor till <b>${esc(am.namn)}</b>${am.kod !== A.kod ? ' <span style="color:var(--warn)">(inte ämnet du har valt nu)</span>' : ''}. Ämnet har ${am.antal} frågor idag.</p>
      <label class="row" style="gap:6px"><input type="checkbox" id="imp-replace"> Ta först bort alla ${am.antal} befintliga frågor i ${esc(am.namn)}</label>
      <div class="row"><button class="btn primary" id="imp-go">Importera</button></div></div>`;
    $('#imp-replace').onchange = ev => { $('#imp-go').textContent = ev.target.checked ? `Ersätt ${am.antal} frågor med ${n}` : 'Importera'; $('#imp-go').classList.toggle('danger', ev.target.checked); };
    $('#imp-go').onclick = async () => {
      try {
        const r = await api('import', { method: 'POST', body: { data: IMP, ersatt: $('#imp-replace').checked } });
        toast(`Importerade ${r.importerade} frågor${r.dubbletter ? `, ${r.dubbletter} fanns redan` : ''}`);
        if (am.kod !== A.kod) { ST.amne = am.kod; saveSt(); }
        await refresh(); IMP = null;
      } catch (err) { toast(err.message, true); }
    };
  };
}

/* ---------------- routing ---------------- */
const VIEWS = ['fragor', 'tackning', 'grupper', 'io'];
let view = 'fragor';
function renderCurrent() {
  if (view === 'fragor') { renderFragor(); if (DRAFT && !dirty && EDIT !== 'ny') openEditor(EDIT, true); }
  if (view === 'tackning') renderTackning();
  if (view === 'grupper') renderGrupper();
  if (view === 'io') renderIO();
}
async function route() {
  let v = location.hash.slice(1); if (!VIEWS.includes(v)) v = 'fragor';
  if (view === 'fragor' && v !== 'fragor' && dirty) { if (!(await leaveEditor())) { history.replaceState(null, '', '#fragor'); return; } }
  view = v;
  VIEWS.forEach(x => $('#v-' + x).hidden = x !== v);
  $$('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + v ? 'page' : 'false'));
  if (v !== 'fragor' && DRAFT) closeEditor(true);
  if (!DRAFT) $('#split').classList.add('noedit');
  renderCurrent();
}
window.addEventListener('hashchange', route);
boot();
</script>
</body>
